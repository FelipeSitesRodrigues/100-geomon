    THESIS: o reservatório é tão forte quanto a emenda mais fraca. A página prova a solda (teste

    teste e os arcos do reservatório redondo. Plus Jakarta Sans 800 apertada nos títulos.
    STORY: quem decide uma obra de seis dígitos vê a obra real, entende como a solda é testada,
    confia na certificação e na estrutura (carreta) e chama no WhatsApp com o serviço já escrito.

    linhas à esquerda com "emenda por emenda." em verde; "Pedir orçamento" verde com luz na borda;
    a faixa de 4 provas na base. No celular: título, vídeo, texto, botões.
    FORM: mockups aprovados pelo Felipe (chat 2, figma.html), pinados; seed: brief-pinned.

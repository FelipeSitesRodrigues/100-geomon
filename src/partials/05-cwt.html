<section class="cwt secao secao--floresta secao--sobe" id="certificacao" aria-labelledby="cwt-titulo">
  <!-- a cena do mockup: o técnico soldando de ponta a ponta (quadro real do vídeo, estendido no
       ChatGPT), escuro à esquerda, onde fica o texto; o selo da IAGI no alto, à direita, com os
       arcos do reservatório em volta. No tablet e no celular a foto vira um bloco em cima. -->
  <figure class="cwt__foto" data-revela="cena">
    <img data-img="cwt-fundo" sizes="100vw" alt="Técnico certificado da Geomon soldando a geomembrana com a soldadora de cunha, no fim da tarde" loading="lazy" decoding="async">
  </figure>
  <svg class="arcos cwt__arcos" viewBox="-500 -500 1000 1000" aria-hidden="true" focusable="false"><circle r="190"/><circle r="280"/><circle r="375"/><circle r="490"/></svg>
  <img class="cwt__selo" data-img="selo-cwt" data-revela="selo" sizes="(min-width: 64em) 240px, 150px" alt="Selo CWT, Certified Welding Technician, da IAGI" loading="lazy" decoding="async">

  <div class="caixa cwt__texto">
    <i data-i="arrow-up-right" data-w="light" class="cwt__seta"></i>
    <h2 class="titulo" id="cwt-titulo" data-palavras data-revela="palavras">Solda feita<br> por técnico<br> <em>certificado.</em></h2>
    <p class="cwt__unica" data-revela><span class="cwt__check" aria-hidden="true"><i data-i="check" data-w="bold"></i></span>A única empresa brasileira do agro com a certificação CWT da IAGI.</p>
    <div class="botoes" data-revela style="--atraso:.2s">
      <a class="botao botao--verde" href="{{wa:Olá! Vim pelo site da Geomon e quero falar com a equipe.}}" target="_blank" rel="noopener">Falar com a equipe</a>
      <a class="botao botao--contorno" href="#qualidade">Ver como testamos</a>
    </div>
  </div>
</section>

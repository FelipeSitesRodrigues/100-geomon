<section class="escala secao secao--preto secao--sobe" id="obras" aria-labelledby="escala-titulo">
  <svg class="arcos escala__arcos" viewBox="0 0 600 600" aria-hidden="true" focusable="false"><circle cx="300" cy="300" r="150"/><circle cx="300" cy="300" r="220"/><circle cx="300" cy="300" r="295"/></svg>
  <div class="caixa">
    <div class="cabeca">
      <div>
        <span class="etiqueta" data-revela>Escala</span>
        <h2 class="titulo escala__titulo" id="escala-titulo" data-palavras data-revela="palavras"><span class="sem-quebra">+25 milhões de m²</span> <em>instalados.</em></h2>
      </div>
      <p class="cabeca__lado texto" data-revela style="--atraso:.15s">Do oeste da Bahia para todo o MATOPIBA: Maranhão, Tocantins, Piauí e Bahia.</p>
    </div>

    <div class="galeria">
      <figure class="galeria__item galeria__item--grande" data-revela="grade" style="--i:0">
        <img data-img="obra-redondo" sizes="(min-width: 75em) 52vw, 96vw" alt="Reservatório circular de irrigação cheio de água, revestido com geomembrana pela Geomon, no oeste da Bahia" loading="lazy" decoding="async">
        <figcaption class="pilula-vidro">Reservatório circular · Oeste da Bahia</figcaption>
      </figure>
      <figure class="galeria__item" data-revela="grade" style="--i:1">
        <img data-img="obra-pivos" sizes="(min-width: 75em) 34vw, 96vw" alt="Reservatório em formato de triângulo revestido com geomembrana entre pivôs de irrigação" loading="lazy" decoding="async">
        <figcaption class="pilula-vidro">Reservatório entre pivôs</figcaption>
      </figure>
      <figure class="galeria__item" data-revela="grade" style="--i:2">
        <img data-img="obra-canal" sizes="(min-width: 75em) 34vw, 96vw" alt="Canal de irrigação revestido com geomembrana cortando as lavouras de algodão" loading="lazy" decoding="async">
        <figcaption class="pilula-vidro">Canal de irrigação</figcaption>
      </figure>
    </div>

    <a class="link-seta escala__link" data-revela href="{{cfg.instagram}}" target="_blank" rel="noopener">Ver mais obras no Instagram <i data-i="arrow-right" data-w="bold"></i></a>
  </div>
</section>
